# Cloudflare Pages config. The static site deploys as before; these bindings feed the
# /dashboard posting studio (functions/api/*). See "Posting studio" in README.md for setup.
name = "atcoaching-site"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "atcoaching-studio"
database_id = "64b40a36-642d-49db-92fc-4afd856bd863"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "atcoaching-media"

# ACCESS_TEAM_DOMAIN, ACCESS_AUD and ALLOWED_EMAILS are set in the Pages dashboard
# (Settings → Variables). Locally, leave them unset: the API then only answers on localhost.
