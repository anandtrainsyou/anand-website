<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workout Plans | Coach Name</title>
  <meta name="description" content="Free, downloadable workout plans for every level.">
  <meta property="og:title" content="Workout Plans | Coach Name">
  <meta property="og:description" content="Free, downloadable workout plans for every level.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">COACH NAME<span>.</span></a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/#splits">Splits</a>
        <a href="/plans/" aria-current="page">Plans</a>
      </nav>
    </div>
  </header>

  <main class="wrap" id="app">
    <!-- No ?p= in the URL: list every plan. With ?p=<id>: show that plan. -->
    <div class="plan-head">
      <div class="eyebrow">Free plans</div>
      <h1>Workout plans</h1>
      <p class="muted" style="max-width:600px;font-size:1.1rem">Pick one, follow it, and download a PDF to take to the gym.</p>
    </div>
    <div class="grid" id="list" style="padding-bottom:72px"></div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span id="year"></span> Coach Name</span>
      <a href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
    </div>
  </footer>

  <script src="/assets/app.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const id = new URLSearchParams(location.search).get('p');
    loadPlans().then(plans => {
      if (!id) return renderPlanCards(document.getElementById('list'), plans);
      const plan = plans.find(p => p.id === id);
      const app = document.getElementById('app');
      if (plan) renderPlanDetail(app, plan);
      else app.innerHTML = '<div class="plan-head"><a class="back" href="/plans/">&larr; All plans</a><h1>Plan not found</h1><p class="muted">That plan may have been renamed or removed.</p></div>';
    });
  </script>
</body>
</html>
